<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DO NOT PRESS THIS BUTTON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEAE1; --bg2:#e2ded2; --ink:#141414; --panel:#ffffff;
    --yellow:#FFC700; --red:#E11D2A; --blue:#2451FF; --mono-dim:#7a7566;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111111; --bg2:#0a0a0a; --ink:#f2efe6; --panel:#1a1a1a; --mono-dim:#8a8478;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111111; --bg2:#0a0a0a; --ink:#f2efe6; --panel:#1a1a1a; --mono-dim:#8a8478;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Oswald',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden; position:relative;
  }
  .stripe{
    width:100%; height:16px; flex-shrink:0;
    background:repeating-linear-gradient(45deg, var(--yellow) 0 18px, var(--ink) 18px 36px);
  }
  main{
    width:100%; max-width:560px; padding:2.2rem 1.4rem 3rem;
    display:flex; flex-direction:column; align-items:center; text-align:center; flex:1;
  }
  h1{
    font-size:clamp(2rem,8vw,2.9rem); line-height:1.02; font-weight:700;
    letter-spacing:0.01em; margin:0.4rem 0 0.6rem; text-transform:uppercase;
  }
  h1 span{color:var(--red);}
  .sub{
    font-family:'JetBrains Mono',monospace; color:var(--mono-dim);
    font-size:0.85rem; max-width:34ch; margin:0 0 2rem;
  }
  .odometer{
    background:var(--ink); color:var(--yellow); border-radius:6px;
    padding:0.7rem 1.4rem; display:inline-flex; flex-direction:column; gap:0.15rem;
    margin-bottom:2.2rem; box-shadow:inset 0 0 0 3px #000a;
  }
  :root[data-theme="dark"] .odometer, @media (prefers-color-scheme:dark){.odometer{box-shadow:inset 0 0 0 3px #ffffff14;}}
  .odo-label{font-family:'JetBrains Mono',monospace; font-size:0.62rem; letter-spacing:0.15em; opacity:0.75;}
  .odo-num{font-family:'JetBrains Mono',monospace; font-size:2rem; font-weight:700; letter-spacing:0.08em;}

  .big-button{
    width:min(46vw,190px); height:min(46vw,190px); border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff5a4d, var(--red) 60%, #9c0f18 100%);
    border:none; color:#fff; font-family:'Oswald',sans-serif; font-weight:700;
    font-size:1.3rem; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
    box-shadow:0 10px 0 #7d0b12, 0 14px 22px rgba(0,0,0,0.35);
    transition:transform 0.06s ease, box-shadow 0.06s ease;
  }
  .big-button:active{ transform:translateY(8px); box-shadow:0 2px 0 #7d0b12, 0 6px 12px rgba(0,0,0,0.3); }
  .big-button:focus-visible{ outline:3px solid var(--blue); outline-offset:5px; }

  .cancel-slot{ height:70px; display:flex; align-items:center; justify-content:center; margin-top:1.8rem; width:100%; }
  .cancel-button{
    font-family:'JetBrains Mono',monospace; font-size:0.8rem; padding:0.65rem 1.1rem;
    background:var(--panel); color:var(--ink); border:1.5px solid var(--ink);
    border-radius:4px; cursor:pointer; transition:transform 0.12s ease;
    z-index:20;
  }
  .cancel-button:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }

  .terminal{
    margin-top:2rem; width:100%; background:var(--ink); color:#9CFF9C;
    border-radius:6px; padding:0.8rem 0.9rem; font-family:'JetBrains Mono',monospace;
    font-size:0.72rem; text-align:left; height:150px; overflow-y:auto;
    box-shadow:inset 0 0 0 1px #ffffff12;
  }
  .terminal-line{ opacity:0; animation:appear 0.25s ease forwards; margin-bottom:0.35rem; }
  .terminal-line.dim{ color:var(--mono-dim); }
  @keyframes appear{ to{opacity:1;} }

  #confetti-root{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50; }
  .confetto{ position:absolute; top:-20px; opacity:0.95; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(600deg); opacity:0.4; } }

  #siren{
    position:fixed; inset:0; background:var(--red); opacity:0; pointer-events:none;
    mix-blend-mode:multiply; z-index:40; transition:opacity 0.08s ease;
  }
  #siren.on{ opacity:0.35; }

  body.shake{ animation:shakeAnim 0.4s ease; }
  @keyframes shakeAnim{
    0%,100%{ transform:translate(0,0); } 20%{ transform:translate(-6px,3px); }
    40%{ transform:translate(6px,-3px); } 60%{ transform:translate(-4px,-2px); } 80%{ transform:translate(4px,2px); }
  }
  @media (prefers-reduced-motion: reduce){
    body.shake{ animation:none; }
    .confetto{ animation:none; display:none; }
  }
  footer{ font-family:'JetBrains Mono',monospace; font-size:0.65rem; color:var(--mono-dim); padding-bottom:1rem; }
</style>
</head>
<body>
<div class="stripe"></div>
<div id="siren"></div>
<div id="confetti-root"></div>

<main>
  <h1>DO NOT PRESS<br><span>THIS BUTTON</span></h1>
  <p class="sub">We thought about this warning for a long time. Please take it seriously.</p>

  <div class="odometer">
    <span class="odo-label">INCIDENTS TO DATE</span>
    <span class="odo-num" id="count">000</span>
  </div>

  <button class="big-button" id="bigButton">Press</button>

  <div class="cancel-slot">
    <button class="cancel-button" id="cancelButton">I've changed my mind</button>
  </div>

  <div class="terminal" id="log">
    <div class="terminal-line dim">SYSTEM READY. AWAITING POOR DECISIONS.</div>
  </div>
</main>

<div class="stripe"></div>
<footer>facility uptime: questionable</footer>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var countEl = $('count'), logEl = $('log'), sirenEl = $('siren'), confettiRoot = $('confetti-root');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var count = 0;
  try {
    var saved = window.localStorage.getItem('panic-incidents');
    if (saved !== null) count = parseInt(saved, 10) || 0;
  } catch(e) {}

  function renderCount(){
    countEl.textContent = String(count).padStart(3, '0');
  }
  renderCount();

  var messages = [
    "Well. That happened.",
    "Nobody tell the supervisor.",
    "Structural integrity: probably fine.",
    "Adding this to your permanent record.",
    "The button did not enjoy that.",
    "This is exactly why we can't have nice things.",
    "Alarm noted. Alarm ignored.",
    "A committee has been formed to discuss this.",
    "Congratulations, you found out.",
    "That was not supposed to be possible.",
    "Please remain calm. This is fine.",
    "Rebooting sense of judgment...",
    "The button has filed a complaint.",
    "Incident logged. Regret: pending."
  ];
  var milestones = { 5:"Five incidents. You're a regular now.", 13:"Unlucky number. Should've stopped.", 42:"The answer, apparently, was chaos." };

  function log(text, dim){
    var line = document.createElement('div');
    line.className = 'terminal-line' + (dim ? ' dim' : '');
    var t = new Date().toLocaleTimeString();
    line.textContent = '[' + t + '] ' + text;
    logEl.appendChild(line);
    while (logEl.children.length > 8) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function shake(){
    if (reduceMotion) return;
    document.body.classList.remove('shake');
    void document.body.offsetWidth;
    document.body.classList.add('shake');
    setTimeout(function(){ document.body.classList.remove('shake'); }, 400);
  }

  function sirenFlash(){
    sirenEl.classList.add('on');
    setTimeout(function(){ sirenEl.classList.remove('on'); }, 130);
    setTimeout(function(){ sirenEl.classList.add('on'); }, 220);
    setTimeout(function(){ sirenEl.classList.remove('on'); }, 340);
  }

  function confetti(n){
    if (reduceMotion) return;
    var colors = ['#FFC700', '#E11D2A', '#2451FF', '#141414'];
    for (var i = 0; i < n; i++){
      var el = document.createElement('div');
      el.className = 'confetto';
      var size = 6 + Math.random() * 6;
      el.style.width = size + 'px';
      el.style.height = (size * 0.4) + 'px';
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
      confettiRoot.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 3200); })(el);
    }
  }

  function beep(){
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'square';
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      osc.frequency.setValueAtTime(660, ctx.currentTime);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
      osc.frequency.setValueAtTime(660, ctx.currentTime + 0.24);
      osc.start();
      osc.stop(ctx.currentTime + 0.36);
      osc.onended = function(){ ctx.close(); };
    } catch(e) {}
  }

  $('bigButton').addEventListener('click', function(){
    count++;
    try { window.localStorage.setItem('panic-incidents', String(count)); } catch(e) {}
    renderCount();
    shake();
    sirenFlash();
    confetti(reduceMotion ? 0 : 26);
    beep();
    if (milestones[count]) {
      log(milestones[count]);
    } else {
      log(messages[Math.floor(Math.random() * messages.length)]);
    }
  });

  // Runaway cancel button
  var cancelBtn = $('cancelButton'), slot = document.querySelector('.cancel-slot');
  var dodges = 0, dodgeLimit = 6, fleeing = false;
  var taunts = ["Nope.", "Not today.", "Try again.", "So close.", "Almost!", "Predictable."];

  function flee(){
    var rect = cancelBtn.getBoundingClientRect();
    if (!fleeing){
      cancelBtn.style.position = 'fixed';
      cancelBtn.style.left = rect.left + 'px';
      cancelBtn.style.top = rect.top + 'px';
      fleeing = true;
    }
    var w = cancelBtn.offsetWidth, h = cancelBtn.offsetHeight;
    var maxX = window.innerWidth - w - 12, maxY = window.innerHeight - h - 12;
    var nx = Math.max(12, Math.random() * maxX);
    var ny = Math.max(12, Math.random() * maxY);
    cancelBtn.style.left = nx + 'px';
    cancelBtn.style.top = ny + 'px';
    dodges++;
    cancelBtn.textContent = taunts[Math.floor(Math.random() * taunts.length)];
    if (dodges >= dodgeLimit){
      cancelBtn.textContent = "Fine. Catch me.";
    }
  }

  cancelBtn.addEventListener('pointerenter', function(){
    if (dodges < dodgeLimit && !reduceMotion) flee();
  });

  cancelBtn.addEventListener('click', function(){
    if (dodges < dodgeLimit && !reduceMotion) { flee(); return; }
    log("Cancellation accepted. Nothing happened anyway.", true);
    cancelBtn.textContent = "I've changed my mind";
    cancelBtn.style.position = '';
    cancelBtn.style.left = '';
    cancelBtn.style.top = '';
    fleeing = false;
    dodges = 0;
  });
})();
</script>
</body>
</html>
